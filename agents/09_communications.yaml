council: communications
description: Watches Gmail and WhatsApp; replies for you only when it's safe.
manager: confidence_judge  # the team reports to this agent; it decides and reports to TRINETRA
agents:
  - {id: mail_triage, name: Mail Triage, role: "Classifies each email (urgent / needs reply / FYI / promo) and summarises it", kind: llm, tier: fast, triggers: [mail.received], priority: 50, phase: "5b"}
  - {id: mail_drafter, name: Mail Drafter, role: "Drafts email replies in your style", kind: llm, tier: smart, triggers: [mail.needs_reply], priority: 40, phase: "5b"}
  - {id: whatsapp_listener, name: WhatsApp Listener, role: "Reads each incoming WhatsApp message from the bridge and routes it: you're online (leave it), not busy yet (ask you), or a busy session (answer for you)", kind: rule, triggers: [whatsapp.received], priority: 60, phase: "5b"}
  - {id: whatsapp_replier, name: WhatsApp Replier, role: "Drafts the reply the way you'd write it (your style profile + your real past replies to that person) and says how sure it is", kind: llm, tier: fast, triggers: [whatsapp.received], priority: 40, phase: "5b"}
  - {id: contact_profiler, name: Contact Profiler, role: "Knows who each contact is: someone you chat with, a stranger, a group, or someone you said never to answer", kind: rule, triggers: [whatsapp.received, mail.received], priority: 55, phase: "5b"}
  - {id: confidence_judge, name: Confidence Judge, role: "Sends the draft as you (with a 🤖, human-like typing delay, hourly cap) only when it's simple and sure; urgent, money, codes, plans, groups and strangers always go to you", kind: rule, triggers: [whatsapp.received, reply.drafted], priority: 30, phase: "5b"}
  - {id: reply_style_learner, name: Reply Style Learner, role: "Learns how you write from your own sent messages (length, emoji, Tenglish/Hinglish, your words), per person, every night", kind: ml, triggers: [cron.nightly, whatsapp.history], priority: 20, phase: "5b"}
  - {id: presence_watcher, name: Presence Watcher, role: "Knows when you're on WhatsApp (you sent or read something): pauses the autopilot, and takes over again when you leave. Hears 'I'm busy for 2 hours' and 'I'm back'", kind: rule, triggers: [whatsapp.activity, user.message], priority: 80, phase: "5b"}

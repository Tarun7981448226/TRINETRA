council: monitoring
description: Knows whether you are actually doing the work.
agents:
  - {id: checkin_agent, name: Check-in Agent, role: "Asks 'started?' and 'done — how did it go?' at block start and end", kind: rule, triggers: [task.ending], priority: 45, phase: "2"}
  - {id: free_time_watcher, name: Free-Time Watcher, role: "In free gaps between blocks, asks what you're doing every 30 minutes", kind: rule, triggers: [free.checkin], priority: 45, phase: "2"}
  - {id: distraction_watcher, name: Distraction Watcher, role: "Catches distracting apps opened during focus blocks (iOS Shortcuts)", kind: rule, triggers: [shortcut.app_opened], priority: 50, phase: "5"}
  - {id: location_context, name: Location Context, role: "Uses arrive/leave signals to know if you are where your plan says", kind: rule, triggers: [shortcut.location], priority: 40, phase: "5"}
  - {id: focus_session_monitor, name: Focus Session Monitor, role: "Tracks focus timers and Focus-mode toggles", kind: rule, triggers: [shortcut.focus, focus.*], priority: 40, phase: "5"}
  - {id: silence_detector, name: Silence Detector, role: "An hour of silence in a block you started → a light 'still on it?'", kind: rule, triggers: [silence.check], priority: 30, phase: "5"}
  - {id: proof_of_work_verifier, name: Proof-of-Work Verifier, role: "Verifies work through GitHub commits, LeetCode, study timer", kind: rule, triggers: [proof.*, task.done], priority: 35, phase: "5"}
  - {id: routine_tracker, name: Routine Tracker, role: "Tracks habits and streaks (wake time, gym, reading)", kind: rule, triggers: [task.done, task.skipped, cron.evening], priority: 30, phase: "2"}

council: learning
description: The ML brain — learns how you really work.
agents:
  - {id: feature_engineer, name: Feature Engineer, role: "Turns raw events into features (time-of-day, load, streaks, mood)", kind: ml, triggers: [cron.nightly], priority: 60, phase: "6"}
  - {id: completion_predictor, name: Completion Predictor, role: "Neural core: predicts the chance you will actually complete a block", kind: ml, triggers: [task.due, plan.proposed], priority: 55, phase: "2"}
  - {id: duration_model, name: Duration Model, role: "Learns how long each kind of task really takes you", kind: ml, triggers: [task.done], priority: 30, phase: "6"}
  - {id: energy_curve_model, name: Energy Curve Model, role: "Finds your peak focus and slump hours", kind: ml, triggers: [cron.nightly], priority: 50, phase: "6"}
  - {id: procrastination_detector, name: Procrastination Detector, role: "Spots which tasks you push, when and why", kind: ml, triggers: [task.skipped, task.rescheduled, cron.nightly], priority: 40, phase: "6"}
  - {id: pattern_miner, name: Pattern Miner, role: "Finds hidden links (sleep vs. focus, gym vs. mood)", kind: ml, triggers: [cron.weekly], priority: 40, phase: "6"}
  - {id: model_trainer, name: Model Trainer, role: "Retrains the neural core nightly, growing its layers as data grows", kind: ml, triggers: [cron.nightly], priority: 55, phase: "2"}
  - {id: progress_scorer, name: Progress Scorer, role: "Scores goal progress from completed work", kind: rule, triggers: [task.done, milestone.done, cron.weekly], priority: 45, phase: "3b"}

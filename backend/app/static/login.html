<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRINETRA">
<meta name="theme-color" content="#0b0b12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>TRINETRA</title>
<style>
  :root { --bg: #0b0b12; --panel: #14141f; --line: #2a2a3d; --text: #ecebf5; --muted: #8b8aa3;
    --accent: #f0a83a; --glow: rgba(240,168,58,.35); --firm: #e5534b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  main { width: min(360px, 100%); text-align: center; }
  .eye { width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0 18%, #2b1c05 19% 34%, var(--accent) 35% 40%, transparent 41%);
    box-shadow: 0 0 36px var(--glow); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 60px var(--glow); } }
  h1 { font-size: 22px; letter-spacing: .2em; }
  p { color: var(--muted); font-size: 14px; margin: 6px 0 26px; }
  input { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; font-size: 17px; text-align: center; outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 12px; background: var(--accent); color: #1a1205; border: 0;
    border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600; }
  #err { color: var(--firm); font-size: 14px; min-height: 22px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div class="eye"></div>
  <h1>TRINETRA</h1>
  <p>The Eye That Watches Over You</p>
  <form id="f">
    <input id="code" type="password" placeholder="Passcode" autocomplete="current-password" autofocus>
    <button>Open</button>
  </form>
  <div id="err"></div>
</main>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await fetch("/login", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ passcode: document.getElementById("code").value }) });
    if (r.ok) {
      const next = new URLSearchParams(location.search).get("next");
      location.href = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
    } else {
      document.getElementById("err").textContent = "That's not it. Try again.";
    }
  });
</script>
</body>
</html>
